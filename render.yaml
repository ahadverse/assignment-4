# Render blueprint for the GearUp backend.
# Create a new Blueprint on Render pointed at this repository, then set the
# secret values marked "sync: false" in the Render dashboard.
services:
  - type: web
    name: gearup-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /api
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@gearup.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
